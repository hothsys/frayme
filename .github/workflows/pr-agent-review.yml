name: PR Agent Review
# Calls the org's shared AI code-review workflow in hothsys/.github
# (.github#34). Review only, free OpenRouter models only. A PR whose changed
# files are all docs or repo config is skipped at zero OpenRouter cost, and
# each push gets an incremental review of just the new commits (synchronize
# is in the trigger types for that).
#
# pull_request (not pull_request_target): GitHub itself withholds secrets and
# write access from fork PRs, and the reusable skips bot-authored and fork
# PRs explicitly. The dedicated OPENROUTER_PR_AGENT_KEY org secret flows in
# via secrets: inherit.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  review:
    uses: hothsys/.github/.github/workflows/reusable-pr-agent.yml@v2
    # The shared workflow can't have more permissions than its caller grants.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit
