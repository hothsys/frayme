name: PR Summary
# Calls the org's shared AI summary workflow. Replace <org> below with the
# organization that owns the public .github repo hosting the shared workflow.
#
# pull_request (not pull_request_target): GitHub itself withholds secrets and
# write access from fork PRs. Dependabot runs read OPENROUTER_API_KEY from the
# Dependabot secret store, so it must exist there as well as under Actions.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The PR number to force summarize'
        required: true
jobs:
  summary:
    uses: hothsys/.github/.github/workflows/reusable-pr-summary.yml@v1
    # The shared workflow can't have more permissions than its caller grants.
    permissions:
      pull-requests: write
    secrets: inherit
